name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - iOS
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build simulator app
        working-directory: ios
        run: |
          xcodebuild -project LegadoiOS.xcodeproj \
            -scheme LegadoiOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip simulator app
        working-directory: ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/LegadoiOS.app \
            LegadoiOS-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: LegadoiOS-simulator
          path: ios/LegadoiOS-simulator.zip
